[package]
name = "shared"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# Used by Tauri backend as a regular Rust library
crate-type = ["rlib"]

[features]
default = ["ml", "camera", "push"]
camera = []
push = []
full = ["camera", "push", "ml"]
test-utils = []
# Optional ML stack - kept optional to speed up build times when not needed
ml = ["dep:ort", "dep:ndarray", "dep:fast_image_resize"]

[dependencies]
# --- Crux Core ---
crux_core = "0.15.0"
crux_http = "0.14.0"
crux_kv = "0.9.0"

# --- Serialization ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.7", features = ["v4", "serde"] }
ciborium = "0.2"

# --- Crypto & Security ---
getrandom = { version = "0.2", features = ["js"] }
chacha20poly1305 = "0.10"
aead = "0.5"
secrecy = { version = "0.8", features = ["serde"] }
zeroize = "1.7"
blake3 = "1.5"
rand = "0.8"

# --- Image Processing ---
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
url = "2.5"

# --- ML Stack (Optional via Features) ---
ort = { version = "2.0.0-rc.11", features = ["ndarray"], optional = true }
ndarray = { version = "0.17", optional = true }
fast_image_resize = { version = "3", optional = true }

# --- Utilities ---
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"
lru = "0.12"

# --- Time & Space (use library types directly) ---
chrono = { version = "0.4", features = ["serde"] }
geo = { version = "0.28", features = ["serde"] }
chrono-humanize = "0.2"

# --- Database ---
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio"] }

[dependencies.tokio]
version = "1.36"
features = ["sync", "macros", "rt"]

# SQLite via sqlx only (to avoid libsqlite3-sys conflicts)

[dev-dependencies]
proptest = "1.4"
tempfile = "3.10"
# Tests need the full multithreaded runtime
tokio = { version = "1.36", features = ["rt-multi-thread", "macros"] }