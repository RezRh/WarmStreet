[package]
name = "warmstreet"
version = "1.0.0"
description = "WarmStreet - Zero-Latency Animal Rescue Coordination"
authors = ["WarmStreet Team"]
edition = "2021"
publish = false

[lib]
name = "warmstreet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "warmstreet"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-nativemap = { path = "../tauri-plugin-nativemap" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Shared Rust Core (Crux)
shared = { path = "../shared" }
